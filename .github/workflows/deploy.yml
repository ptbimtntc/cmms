name: Build and Deploy Vite Assets
on:
  push:
    branches:
      - main # Ganti dengan nama branch Anda jika bukan main

jobs:
  web-deploy:
    name: Deploy Assets
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install NPM Packages & Build Vite
      run: |
        npm install
        npm run build

    - name: Sync Build Folder to Hostinger via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/build/
        server-dir: public_html/public/build/
